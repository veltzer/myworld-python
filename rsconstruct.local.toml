# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# Runtime deps so CI installs what the code imports (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern. google-api-python-client provides
# apiclient; types-httplib2 gives mypy the stubs.
[dependencies]
pip = [
    "google-api-python-client",
    "google-api-python-client-stubs",
    "httplib2",
    "oauth2client",
    "types-httplib2",
]
