# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "myworld-python"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client",
    "httplib2",
    "oauth2client",
]

[dependency-groups]
dev = [
    "google-api-python-client-stubs",
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-httplib2",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "oauth2client.*",
]
ignore_missing_imports = true
