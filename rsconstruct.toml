# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.python]

[processor.ruff]
src_dirs = ["src"]

[processor.pylint]
src_dirs = ["src"]

[processor.mypy]
src_dirs = ["src"]

[processor.requirements]
src_dirs = ["src"]

[processor.taplo]
src_dirs = ["."]

# Runtime deps so CI installs what the code imports (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern. google-api-python-client provides
# apiclient; types-httplib2 gives mypy the stubs.
[dependencies]
pip = [
    "google-api-python-client",
    "google-api-python-client-stubs",
    "httplib2",
    "oauth2client",
    "types-httplib2",
]
